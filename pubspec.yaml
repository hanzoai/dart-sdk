name: hanzoai
description: The Dart client for the Hanzo Cloud API — every /v1 route on api.hanzo.ai, generated from the document the platform emits.
version: 8.5.156
repository: https://github.com/hanzo-dart/sdk
homepage: https://hanzo.ai
issue_tracker: https://github.com/hanzo-dart/sdk/issues
documentation: https://github.com/hanzo-dart/sdk#readme
topics: [hanzo, api-client, openapi, cloud]

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  collection: ^1.17.0
  http: ^1.3.0
  intl: '>=0.18.0 <0.21.0'
  meta: ^1.1.8

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
